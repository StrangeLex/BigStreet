name: Release launcher

# Construit l'installeur Windows et publie la release dès qu'un tag v* est poussé.
# La construction se fait sur un vrai Windows : pas de wine, pas de surprise.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # nécessaire pour créer la release et y joindre l'exe

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire et publier
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Conserver l'installeur comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: BigStreet-Setup
          path: |
            dist/*.exe
            dist/*.nsis.7z
          if-no-files-found: warn

name: Release launcher

# Construit l'installeur Windows et publie la release dès qu'un tag v* est poussé.
# La construction se fait sur un vrai Windows : pas de wine, pas de surprise.
#
# Étapes, toutes visibles dans l'onglet Actions du dépôt :
#  1. construction (electron-builder, sans publier) ;
#  2. signature de l'installeur par SignPath — seulement si le projet SignPath
#     est configuré (secret SIGNPATH_API_TOKEN), sinon l'installeur reste non signé ;
#  3. empreintes SHA-256 (fichier SHA256SUMS.txt + notes de la release) ;
#  4. attestation de provenance : GitHub certifie que ces fichiers sortent de
#     CE commit, construits par CE workflow (vérifiable avec `gh attestation verify`) ;
#  5. analyse VirusTotal — seulement si le secret VIRUSTOTAL_API_KEY existe ;
#  6. publication de la release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # créer la release et y joindre les fichiers
  id-token: write          # attestation de provenance
  attestations: write
  actions: read            # SignPath relit l'artefact envoyé

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire (sans publier)
        run: npx electron-builder --win --publish never

      # (l'installeur web range ses fichiers dans un sous-dossier, dist/nsis-web :
      # on rassemble ceux de la release dans out/, quel que soit l'endroit)
      - name: Repérer les fichiers
        id: files
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "setup=BigStreet-Setup-$version.exe" >> "$GITHUB_OUTPUT"
          find dist -maxdepth 2 -type f | grep -v unpacked
          mkdir out
          find dist -maxdepth 2 -type f \( -name "BigStreet-Setup-$version.exe*" -o -name "*.7z" -o -name "latest.yml" \) -not -path "*unpacked*" -exec cp {} out/ \;
          ls -la out
          for f in "out/BigStreet-Setup-$version.exe" out/latest.yml; do [ -f "$f" ] || { echo "::error::$f introuvable"; exit 1; }; done
          ls out/*.7z > /dev/null || { echo "::error::paquet .7z introuvable"; exit 1; }

      # ---- 2. Signature (SignPath) ------------------------------------------
      - name: Envoyer l'installeur à SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installeur-non-signe
          path: out/${{ steps.files.outputs.setup }}
          if-no-files-found: error

      - name: Signer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'BigStreet' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # La signature change l'empreinte de l'installeur : latest.yml (que lit la
      # mise à jour automatique) est recalculé, sinon les mises à jour échoueraient.
      - name: Remplacer par l'installeur signé
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          setup="${{ steps.files.outputs.setup }}"
          node tools/fix-latest.mjs "out/$setup" "signed/$setup" out/latest.yml
          cp "signed/$setup" "out/$setup"
          rm -f "out/$setup.blockmap"
          powershell -NoProfile -Command "(Get-AuthenticodeSignature 'out/$setup') | Format-List Status,SignerCertificate"

      # ---- 3. Empreintes ------------------------------------------------------
      - name: Calculer les empreintes
        run: |
          cd out
          sha256sum *.exe *.7z latest.yml > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ---- 4. Attestation de provenance --------------------------------------
      # (elle porte sur exactement les fichiers de SHA256SUMS.txt)
      - name: Attester la provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: out/SHA256SUMS.txt

      # ---- 5. VirusTotal ------------------------------------------------------
      - name: Analyse VirusTotal
        if: env.VIRUSTOTAL_API_KEY != ''
        run: |
          setup="out/${{ steps.files.outputs.setup }}"
          curl -sf --request POST --url https://www.virustotal.com/api/v3/files \
            --header "x-apikey: $VIRUSTOTAL_API_KEY" --form "file=@$setup" > /dev/null \
            && echo "vt=ok" >> "$GITHUB_ENV" || echo "::warning::envoi à VirusTotal refusé"

      # ---- 6. Publication -----------------------------------------------------
      # Les notes ne contiennent ici que la vérification, sous un marqueur :
      # l'onglet Notes du launcher ne montre que ce qui est écrit au-dessus.
      - name: Publier la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.files.outputs.version }}"; setup="${{ steps.files.outputs.setup }}"
          sha=$(sha256sum "out/$setup" | cut -d' ' -f1)
          {
            echo "<!-- verification -->"
            echo "### Vérifier ce que tu télécharges"
            echo ""
            echo "SHA-256 de \`$setup\` :"
            echo ""
            echo "\`$sha\`"
            echo ""
            echo "- Toutes les empreintes : \`SHA256SUMS.txt\`"
            echo "- Provenance (construit ici, depuis le commit \`${GITHUB_SHA::7}\`) : \`gh attestation verify $setup --repo $GITHUB_REPOSITORY\`"
            echo "- Journal de construction : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [ "${vt:-}" = ok ]; then echo "- Analyse VirusTotal : https://www.virustotal.com/gui/file/$sha"; fi
            if [ -n "$SIGNPATH_API_TOKEN" ]; then echo "- Signature gratuite fournie par [SignPath.io](https://about.signpath.io), certificat de [SignPath Foundation](https://signpath.org)"; fi
          } > notes.md
          files=(out/*.exe out/*.7z out/latest.yml out/SHA256SUMS.txt)
          for b in out/*.blockmap; do [ -e "$b" ] && files+=("$b"); done
          gh release create "v$v" "${files[@]}" --title "$v" --notes-file notes.md --verify-tag

      # Les releases s'accumulent à chaque déploiement. On ne garde que les
      # trois dernières : la version en cours et deux retours arrière possibles.
      # (Supprimer une release retire aussi le paquet que son installeur web
      # allait chercher : un vieux .exe encore sur un disque ne pourra plus
      # s'installer. C'est le prix du ménage, et c'est voulu.)
      - name: Ne garder que les 3 dernières versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vieilles=$(gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName')
          if [ -z "$vieilles" ]; then echo "rien à supprimer"; exit 0; fi
          for t in $vieilles; do
            echo "suppression de $t"
            gh release delete "$t" --yes --cleanup-tag || echo "  (échec, on continue)"
          done

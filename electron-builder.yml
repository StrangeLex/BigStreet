appId: com.strangelex.bigstreet
productName: Big Street
copyright: © StrangeLex

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  - "!**/*.map"

# Les mises à jour du launcher viennent des releases GitHub (dépôt public :
# aucun jeton n'est nécessaire côté joueur, et aucun secret n'est embarqué).
publish:
  provider: github
  owner: StrangeLex
  repo: BigStreet
  releaseType: release

win:
  target:
    # « nsis-web » : l'installeur distribue est un petit lanceur (~1,5 Mo) qui
    # telecharge le paquet complet au moment de l'installation. L'utilisateur
    # ne recupere plus 78 Mo avant de savoir s'il veut installer.
    - target: nsis-web
      arch: [x64]
  icon: build/icon.png
  artifactName: BigStreet-Setup-${version}.${ext}

# Emplacement d'ou le petit installeur tire le paquet complet : la release GitHub.
nsisWeb:
  appPackageUrl: https://github.com/StrangeLex/BigStreet/releases/download/v${version}/

nsis:
  oneClick: false                 # l'utilisateur voit où il installe
  perMachine: false               # installation par utilisateur : pas d'UAC
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Big Street
  deleteAppDataOnUninstall: false
  differentialPackage: true       # mises à jour différentielles (téléchargement réduit)

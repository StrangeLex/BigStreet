<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  :root{ --bg:#ffffff; --ink:#15181f; --muted:#6b7280; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0f17; --ink:#eef1f6; --muted:rgba(255,255,255,.65); }
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;padding:24px}
  h1{font-size:22px;margin:0;font-weight:800}
  p{margin:0;font-size:14px;line-height:1.6;color:var(--muted);max-width:420px}
  button{margin-top:10px;border:none;border-radius:11px;padding:12px 26px;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#22d3ee,#ff24b6)}
  .ic{font-size:44px}
</style></head>
<body>
  <div class="wrap">
    <div class="ic">🔌</div>
    <h1>Serveur injoignable</h1>
    <p>Big Street n'a pas pu se connecter. Vérifie ta connexion internet —
       si elle fonctionne, le serveur est peut-être en maintenance.</p>
    <button onclick="location.href='https://playbigstreet.com/'">Réessayer</button>
  </div>
</body>
</html>

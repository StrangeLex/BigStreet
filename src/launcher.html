<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:;">
<title>Big Street</title>
<style>
  /* Thème clair par défaut, thème sombre si le système est en sombre.
     Electron applique « prefers-color-scheme » d'après le réglage de Windows. */
  :root{
    --bg:#ffffff; --ink:#15181f; --muted:#6b7280; --line:#e6e8ee;
    --hover:#f3f4f7; --soft:#f6f7f9; --field:#ffffff; --body:#374151;
    --accent:#ff24b6; --accent2:#22d3ee; --ok:#16a34a; --err:#dc2626;
    --halo:.14;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171d; --ink:#eef1f6; --muted:#9aa3b2; --line:#272c35;
      --hover:#1e222a; --soft:#1b1f26; --field:#1a1e25; --body:#c3cad6;
      --ok:#4ade80; --err:#f87171; --halo:.26;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none}

  /* ---- barre de titre maison (la fenêtre n'a pas de bordure Windows) ---- */
  .bar{height:38px;display:flex;align-items:center;gap:10px;padding:0 0 0 14px;
    border-bottom:1px solid var(--line);-webkit-app-region:drag}
  .bar .name{font-size:13px;font-weight:800;letter-spacing:.5px}
  .bar .sp{flex:1}
  .bar button{-webkit-app-region:no-drag;width:46px;height:38px;border:none;background:transparent;
    cursor:pointer;font-size:15px;color:var(--muted);line-height:1}
  .bar button:hover{background:var(--hover);color:var(--ink)}
  .bar button.x:hover{background:#dc2626;color:#fff}

  .body{height:calc(100% - 38px);display:flex}
  .side{width:188px;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
  .side button{border:none;background:transparent;text-align:left;padding:10px 12px;border-radius:9px;
    cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--muted);font-weight:600}
  .side button:hover{background:var(--soft);color:var(--ink)}
  .side button.on{background:var(--hover);color:var(--ink)}
  .side .sp{flex:1}
  .who{font-size:11.5px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
  .who b{color:var(--ink);display:block;font-size:13px}

  .main{flex:1;padding:20px 22px;overflow-y:auto}
  h2{margin:0 0 4px;font-size:17px}
  .hint{margin:0 0 16px;font-size:12.5px;color:var(--muted);line-height:1.5}

  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px}
  input[type=text],input[type=password],input[type=email]{width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:9px;font-family:inherit;font-size:13.5px;background:var(--field);color:var(--ink);user-select:text}
  input:focus{outline:none;border-color:var(--accent)}
  .cta{margin-top:16px;width:100%;border:none;border-radius:11px;padding:13px;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--accent2),var(--accent))}
  .cta:disabled{opacity:.55;cursor:default}
  .msg{margin-top:10px;font-size:12.5px;min-height:17px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}

  /* ---- connexion / inscription : formulaire à gauche, personnages à droite ---- */
  .auth{display:grid;grid-template-columns:minmax(0,1fr) 224px;gap:20px;align-items:start}
  .seg{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);
    border-radius:11px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;border:none;background:transparent;border-radius:8px;padding:8px 10px;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  /* Décor : les personnages sont les vrais avatars du jeu, rendus par son moteur. */
  .art{position:relative;isolation:isolate;height:336px;padding-bottom:22px;
    display:flex;align-items:flex-end;justify-content:center}
  .art::before{content:'';position:absolute;inset:auto 0 16% 0;height:70%;z-index:0;
    background:radial-gradient(58% 50% at 50% 72%,var(--accent) 0%,transparent 70%);
    opacity:var(--halo);filter:blur(6px)}
  .art img{position:relative;z-index:2;height:100%;filter:drop-shadow(0 14px 18px rgba(0,0,0,.26))}
  .art img#artA{transform:translateX(-24px)}
  .art img.b{position:absolute;right:0;bottom:22px;z-index:1;height:70%;opacity:.92}
  .art .cap{position:absolute;left:0;right:0;bottom:0;text-align:center;
    font-size:11px;color:var(--muted)}

  /* ---- choix du personnage de départ ---- */
  .picks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
  .pick{border:1px solid var(--line);background:var(--soft);border-radius:11px;padding:8px 4px 6px;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
  .pick img{height:74px;pointer-events:none}
  .pick small{font-size:10.5px;color:var(--muted)}
  .pick.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--soft))}
  .pick.on small{color:var(--ink);font-weight:700}

  .inline{display:flex;gap:8px;align-items:flex-end}
  .inline .cta{margin-top:0;width:auto;white-space:nowrap;padding:10px 14px;font-size:13px}

  .notes article{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:11px}
  .notes h3{margin:0 0 3px;font-size:14px}
  .notes time{font-size:11.5px;color:var(--muted)}
  .notes p{margin:7px 0 0;font-size:13px;line-height:1.55;color:var(--body);white-space:pre-wrap}

  .row{display:flex;align-items:center;gap:12px;margin-top:6px}
  input[type=range]{flex:1;accent-color:var(--accent)}
  .val{min-width:96px;text-align:right;font-size:13px;font-weight:700}
  .note{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
  <div class="bar">
    <span class="name">BIG STREET</span>
    <span class="sp"></span>
    <button id="min" title="Réduire">—</button>
    <button id="close" class="x" title="Fermer">✕</button>
  </div>

  <div class="body">
    <nav class="side">
      <button data-tab="play" class="on">Jouer</button>
      <button data-tab="notes">Nouveautés</button>
      <button data-tab="opt">Options</button>
      <span class="sp"></span>
      <div class="who" id="who"><b>Non connecté</b>Connecte-toi pour jouer</div>
    </nav>

    <section class="main">
      <!-- ---------------- Connexion / Inscription / Jouer ---------------- -->
      <div id="tab-play">
        <div id="authBox" class="auth">
          <div>
            <div class="seg">
              <button id="tabLogin" class="on">Se connecter</button>
              <button id="tabSignup">Créer un compte</button>
            </div>

            <!-- Connexion -->
            <div id="loginBox">
              <label for="u">Pseudo</label>
              <input id="u" type="text" autocomplete="username" spellcheck="false" maxlength="16">
              <label for="p">Mot de passe</label>
              <input id="p" type="password" autocomplete="current-password">
              <button class="cta" id="login">Se connecter</button>
              <div class="msg" id="loginMsg"></div>
            </div>

            <!-- Inscription -->
            <div id="signupBox" style="display:none">
              <label for="su">Pseudo</label>
              <input id="su" type="text" autocomplete="username" spellcheck="false" maxlength="16"
                     placeholder="3 à 16 caractères">
              <label for="sp1">Mot de passe</label>
              <input id="sp1" type="password" autocomplete="new-password" placeholder="6 caractères minimum">

              <div id="emailStep" style="display:none">
                <label for="se">Adresse e-mail</label>
                <div class="inline">
                  <input id="se" type="email" autocomplete="email" spellcheck="false">
                  <button class="cta" id="sendCode">Recevoir le code</button>
                </div>
                <label for="sc">Code reçu par e-mail</label>
                <input id="sc" type="text" inputmode="numeric" maxlength="6" spellcheck="false" placeholder="6 chiffres">
              </div>

              <label>Ton personnage de départ</label>
              <div class="picks" id="picks"></div>

              <label for="sr">Code de parrainage <span style="font-weight:600">(facultatif)</span></label>
              <input id="sr" type="text" spellcheck="false" maxlength="6" placeholder="ex. a1b2c3">

              <button class="cta" id="signup">Créer mon compte</button>
              <div class="msg" id="signupMsg"></div>
            </div>
          </div>

          <div class="art">
            <img id="artA" alt="">
            <img id="artB" class="b" alt="">
            <span class="cap" id="artCap">Tout se personnalise en jeu.</span>
          </div>
        </div>

        <div id="playBox" style="display:none" class="auth">
          <div>
            <h2>Prêt à jouer</h2>
            <p class="hint" id="playHint"></p>
            <button class="cta" id="play">Lancer Big Street</button>
            <button class="cta" id="logout"
                    style="background:var(--hover);color:var(--ink);margin-top:9px">Se déconnecter</button>
            <div class="msg" id="playMsg"></div>
          </div>
          <div class="art">
            <img id="artC" alt="">
          </div>
        </div>
      </div>

      <!-- ---------------- Notes de version ---------------- -->
      <div id="tab-notes" style="display:none">
        <h2>Nouveautés</h2>
        <p class="hint">Les dernières versions du launcher et du jeu.</p>
        <div class="notes" id="notes">Chargement…</div>
      </div>

      <!-- ---------------- Options ---------------- -->
      <div id="tab-opt" style="display:none">
        <h2>Options</h2>
        <p class="hint">Réglages de l'application. Ils sont conservés sur ta machine.</p>

        <label for="ram">Mémoire maximale allouée au jeu</label>
        <div class="row">
          <input id="ram" type="range" min="10" max="90" step="5">
          <span class="val" id="ramVal">—</span>
        </div>
        <p class="note" id="ramNote"></p>

        <button class="cta" id="save" style="max-width:200px">Enregistrer</button>
        <div class="msg" id="optMsg"></div>
      </div>
    </section>
  </div>

  <script src="chars.js"></script>
  <script src="launcher.js"></script>
</body>
</html>

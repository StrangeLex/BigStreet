<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console — Big Street</title>
<link rel="stylesheet" href="console.css">
</head>
<body>
  <header id="bar">
    <b class="ttl">Console</b>
    <div id="filters" class="filters"></div>
    <input id="search" type="search" placeholder="Filtrer le texte…" spellcheck="false" autocomplete="off">
    <label class="chk" title="Suivre les nouvelles lignes"><input id="follow" type="checkbox" checked> Suivre</label>
    <button id="copy" type="button" title="Copier les lignes affichées">Copier</button>
    <button id="clear" type="button" title="Vider le journal">Effacer</button>
  </header>
  <main id="main">
    <section id="log" tabindex="-1" aria-live="polite"></section>
    <aside id="side">
      <h2>En direct</h2>
      <dl id="stats"></dl>
    </aside>
  </main>
  <div id="hint" hidden></div>
  <form id="cmdForm" autocomplete="off">
    <span class="prompt">]</span>
    <input id="cmd" type="text" spellcheck="false" autocomplete="off" placeholder="Commande — help, Tab pour compléter, ↑ ↓ historique">
    <button type="submit">Envoyer</button>
  </form>
  <script src="console.js"></script>
</body>
</html>
